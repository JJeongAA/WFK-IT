{% extends "base.html" %}
{% block title %}{{ t.thanks_title }}{% endblock %}

{% block content %}
<div class="hero big">
  <div class="hero-emoji">💖</div>
  <h1>{{ t.thanks_title }}</h1>
  <p class="subtitle">{{ t.thanks_sub_a }}<b>{{ name }}</b>{{ t.thanks_sub_b }}</p>
</div>

<a class="btn" href="{{ url_for('write', box_id=box_id) }}">✍️ {{ t.write_more }}</a>
<a class="btn ghost" href="{{ url_for('home') }}">📮 {{ t.make_own }}</a>
{% endblock %}
