{% extends "base.html" %}
{% block title %}{{ t.brand }}{% endblock %}

{% block content %}
<div class="hero">
  <div class="hero-emoji">💌</div>
  <h1>{{ t.brand }}</h1>
  <p class="subtitle">{{ t.home_sub }}</p>
</div>

{% if error_uk %}
<div class="card error-box">⚠️ {{ error_uk if lang == 'uk' else error_ko }}</div>
{% endif %}

<!-- 새 편지함 만들기 -->
<form class="card form" method="post" action="{{ url_for('create') }}">
  <div class="form-title">🆕 {{ t.new_box }}</div>
  <label>{{ t.nick_label }}</label>
  <input type="text" name="name" placeholder="{{ t.nick_ph }}" maxlength="20" required>
  <label>{{ t.pw_label }}</label>
  <input type="password" name="password" placeholder="••••" minlength="4" required>
  <button type="submit" class="btn">📮 {{ t.create_btn }}</button>
</form>

<!-- 로그인 -->
<form class="card form" method="post" action="{{ url_for('enter') }}">
  <div class="form-title">🔑 {{ t.have_box }}</div>
  <label>{{ t.my_nick }}</label>
  <input type="text" name="name" placeholder="{{ t.nick_ph }}" maxlength="20" required>
  <button type="submit" class="btn ghost">📬 {{ t.login_btn }}</button>
</form>

<p class="hint">💡 {{ t.home_hint }}</p>
{% endblock %}
