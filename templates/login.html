{% extends "base.html" %}
{% block title %}{{ t.login_title }}{% endblock %}

{% block content %}
<div class="hero">
  <div class="hero-emoji">🔑</div>
  <h1>{{ box_id }}</h1>
  <p class="subtitle">{{ t.login_sub }}</p>
</div>

{% if error %}
<div class="card error-box">⚠️ {{ t.login_err }}</div>
{% endif %}

<form class="card form" method="post" action="{{ url_for('inbox', box_id=box_id) }}">
  <label>{{ t.pw_label }}</label>
  <input type="password" name="password" required autofocus>
  <button type="submit" class="btn">📬 {{ t.enter_btn }}</button>
</form>

<a class="btn ghost" href="{{ url_for('home') }}">🏠 {{ t.to_home }}</a>
{% endblock %}
